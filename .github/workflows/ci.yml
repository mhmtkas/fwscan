name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          # golangci-lint also checks this, but a dedicated step names the files.
          unformatted=$(gofmt -l . | grep -v '^spike/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest": the action's own default resolves to a
          # golangci-lint built with an older Go than go.mod targets, which
          # fails before it lints anything.
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install squashfs-tools
        # lz4 and zstd support in unsquashfs needs >= 4.4 (spike/NOTES.md T0.4).
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          unsquashfs -version | head -1

      - name: Build the squashfs fixture variants
        run: make fixtures

      # CI runs on amd64, where the race detector always works, so it is
      # required here rather than probed for.
      - run: make test-race

      - name: Install cyclonedx-cli
        run: |
          curl -sSfL -o /usr/local/bin/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64
          chmod +x /usr/local/bin/cyclonedx
          cyclonedx --version

      - name: Validate the SBOM against the CycloneDX 1.6 schema
        run: make validate-sbom

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/fwscan
