name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          # golangci-lint also checks this, but a dedicated step names the files.
          unformatted=$(gofmt -l . | grep -v '^spike/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go.mod is tidy
        # .goreleaser.yaml runs `go mod tidy` in its before hook and refuses to
        # release from a dirty tree, so an untidy go.mod is invisible until the
        # moment a tag is cut. Checking it here fails on the pull request
        # instead.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Third-party licence notices are current
        run: make check-third-party-licenses
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest": the action's own default resolves to a
          # golangci-lint built with an older Go than go.mod targets, which
          # fails before it lints anything.
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install squashfs-tools
        # lz4 and zstd support in unsquashfs needs >= 4.4 (spike/NOTES.md T0.4).
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          unsquashfs -version | head -1

      - name: Build the squashfs fixture variants
        run: make fixtures

      # CI runs on amd64, where the race detector always works, so it is
      # required here rather than probed for.
      - run: make test-race

      - name: Install cyclonedx-cli
        # Pinned, not "latest": an upstream release would otherwise change what
        # this job validates against without a commit here. Installed under
        # sudo, because /usr/local/bin is not the runner user's to write.
        env:
          CYCLONEDX_VERSION: v0.33.1
          # sha256 of cyclonedx-linux-x64 at that tag. A downloaded binary is
          # run against the SBOM this job validates; a swapped release asset
          # would otherwise run unverified.
          CYCLONEDX_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          curl -sSfL -o /tmp/cyclonedx \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_SHA256}  /tmp/cyclonedx" | sha256sum --check --strict
          chmod +x /tmp/cyclonedx
          sudo mv /tmp/cyclonedx /usr/local/bin/cyclonedx
          cyclonedx --version

      - name: Validate the SBOM against the CycloneDX 1.6 schema
        run: make validate-sbom

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/fwscan
